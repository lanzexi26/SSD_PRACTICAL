name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Dependency Security Check
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Integration Testing with Docker Compose
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p nginx/html nginx/conf.d nginx/ssl
          mkdir -p postgres/data
          mkdir -p gitea/data gitea/config

      - name: Copy application files
        run: |
          cp nginx/html/index.html nginx/html/ || echo "index.html already in place"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          sleep 10

      - name: Check if Nginx is running
        run: |
          docker-compose ps
          curl -f http://localhost || exit 1

      - name: Test Nginx configuration
        run: |
          docker-compose exec -T nginx nginx -t

      - name: Check application response
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
          if [ $response -eq 200 ]; then
            echo "Application is responding correctly"
          else
            echo "Application returned HTTP $response"
            exit 1
          fi

      - name: Stop services
        if: always()
        run: docker-compose down

  # UI Testing with Playwright
  ui-test:
    runs-on: ubuntu-latest
    name: UI Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create test directory and files
        run: |
          mkdir -p tests
          cat > package.json << 'EOF'
          {
            "name": "ssd-practical-tests",
            "version": "1.0.0",
            "scripts": {
              "test": "playwright test",
              "test:headed": "playwright test --headed"
            },
            "devDependencies": {
              "@playwright/test": "^1.42.0"
            }
          }
          EOF

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Create Playwright test
        run: |
          cat > tests/app.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');

          test.describe('Secure Search Application', () => {
            test.beforeEach(async ({ page }) => {
              await page.goto('http://localhost');
            });

            test('should load the home page', async ({ page }) => {
              await expect(page).toHaveTitle('Secure Search Application');
              await expect(page.locator('h1')).toContainText('Secure Search');
            });

            test('should display search form elements', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              const submitButton = page.locator('button[type="submit"]');
              
              await expect(searchInput).toBeVisible();
              await expect(submitButton).toBeVisible();
              await expect(submitButton).toContainText('Search');
            });

            test('should accept valid search input', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              await searchInput.fill('test search query');
              await searchInput.press('Enter');
              
              // Should show results page
              await expect(page.locator('#resultPage')).toBeVisible();
              await expect(page.locator('#displayTerm')).toContainText('test search query');
            });

            test('should prevent XSS attacks', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              const errorMessage = page.locator('#errorMessage');
              
              // Try XSS payload
              await searchInput.fill('<script>alert("xss")</script>');
              await searchInput.press('Enter');
              
              // Should show error and stay on home page
              await expect(errorMessage).toBeVisible();
              await expect(errorMessage).toContainText('XSS attack detected');
              await expect(searchInput).toHaveValue('');
              await expect(page.locator('#homePage')).toBeVisible();
            });

            test('should prevent SQL injection attacks', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              const errorMessage = page.locator('#errorMessage');
              
              // Try SQL injection payload
              await searchInput.fill("' OR 1=1 --");
              await searchInput.press('Enter');
              
              // Should show error and stay on home page
              await expect(errorMessage).toBeVisible();
              await expect(errorMessage).toContainText('SQL injection detected');
              await expect(searchInput).toHaveValue('');
              await expect(page.locator('#homePage')).toBeVisible();
            });

            test('should handle return to home functionality', async ({ page }) => {
              // First, do a valid search
              await page.locator('#searchInput').fill('valid search');
              await page.locator('#searchInput').press('Enter');
              
              // Should be on results page
              await expect(page.locator('#resultPage')).toBeVisible();
              
              // Click return button
              await page.locator('#backButton').click();
              
              // Should be back on home page
              await expect(page.locator('#homePage')).toBeVisible();
              await expect(page.locator('#resultPage')).not.toBeVisible();
              await expect(page.locator('#searchInput')).toHaveValue('');
            });

            test('should sanitize HTML entities', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              await searchInput.fill('<b>bold text</b>');
              await searchInput.press('Enter');
              
              // Should display sanitized text, not rendered HTML
              await expect(page.locator('#displayTerm')).toContainText('<b>bold text</b>');
              // Ensure it's not rendered as bold
              const boldElements = await page.locator('#displayTerm b').count();
              expect(boldElements).toBe(0);
            });
          });
          EOF

      - name: Create Playwright config
        run: |
          cat > playwright.config.js << 'EOF'
          module.exports = {
            testDir: './tests',
            timeout: 30000,
            retries: 2,
            use: {
              headless: true,
              viewport: { width: 1280, height: 720 },
              actionTimeout: 10000,
              ignoreHTTPSErrors: true,
            },
            projects: [
              {
                name: 'chromium',
                use: { browserName: 'chromium' },
              },
            ],
            reporter: [
              ['html', { open: 'never' }],
              ['junit', { outputFile: 'test-results/junit.xml' }],
            ],
          };
          EOF

      - name: Start application
        run: |
          mkdir -p nginx/html nginx/conf.d
          cp nginx/html/index.html nginx/html/ || echo "Creating index.html"
          docker-compose up -d
          sleep 10
          docker-compose ps

      - name: Run UI tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Stop services
        if: always()
        run: docker-compose down

  # Security Headers Test
  security-test:
    runs-on: ubuntu-latest
    name: Security Headers Testing
    needs: integration-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: |
          mkdir -p nginx/html nginx/conf.d
          docker-compose up -d
          sleep 10

      - name: Test Security Headers
        run: |
          echo "Testing security headers..."
          headers=$(curl -s -I http://localhost)
          
          # Check for security headers (you can add these to your nginx config)
          check_header() {
            if echo "$headers" | grep -i "$1"; then
              echo "✓ $1 header found"
            else
              echo "✗ $1 header missing (consider adding it)"
            fi
          }
          
          check_header "X-Content-Type-Options"
          check_header "X-Frame-Options"
          check_header "X-XSS-Protection"
          check_header "Strict-Transport-Security"

      - name: Stop services
        if: always()
        run: docker-compose down

  # Performance Test
  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: integration-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: |
          mkdir -p nginx/html nginx/conf.d
          docker-compose up -d
          sleep 10

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run performance test
        run: |
          echo "Running performance test..."
          ab -n 100 -c 10 http://localhost/ | tee performance-results.txt
          
          # Extract and check key metrics
          requests_per_sec=$(grep "Requests per second" performance-results.txt | awk '{print $4}')
          echo "Requests per second: $requests_per_sec"
          
          # Fail if performance is below threshold (adjust as needed)
          if (( $(echo "$requests_per_sec < 50" | bc -l) )); then
            echo "Performance test failed: Requests per second ($requests_per_sec) is below threshold (50)"
            exit 1
          fi

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.txt

      - name: Stop services
        if: always()
        run: docker-compose down
