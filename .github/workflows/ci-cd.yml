name: Full CI Workflow
permissions:
  contents: read          # keep default read-only on your code
  security-events: write  # allow writing code-scanning results
 
on: [push, pull_request]

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MyWebApp"
          path: "."
          format: "HTML"
          out: "dependency-check-report"
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-Check-Report
          path: dependency-check-report

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules
      - name: Install Node.js dependencies
        run: npm install
      - name: Create reports directory
        run: mkdir -p reports
      - name: Install ESLint SARIF Formatter
        run: npm install @microsoft/eslint-formatter-sarif --save-dev
      - name: Run ESLint with SARIF output
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file reports/eslint-results.sarif || true
      - name: Debug ESLint Output
        run: cat reports/eslint-results.sarif || echo "No SARIF report generated"
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/eslint-results.sarif

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create necessary directories
        run: |
          mkdir -p nginx/html nginx/conf.d nginx/ssl
          mkdir -p postgres/data
          mkdir -p workspace git-config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Check service health
        run: |
          echo "=== Docker Services Status ==="
          docker-compose ps
          
          echo "=== Nginx Logs ==="
          docker-compose logs nginx | tail -20
          
          echo "=== Checking Nginx Response ==="
          curl -f http://localhost || exit 1
          
          echo "=== Testing Nginx Configuration ==="
          docker-compose exec -T nginx nginx -t

      - name: Test application endpoints
        run: |
          # Test main page returns 200
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
          if [ $response -eq 200 ]; then
            echo "✓ Main page is responding correctly (HTTP $response)"
          else
            echo "✗ Main page returned HTTP $response"
            exit 1
          fi
          
          # Test that index.html contains expected content
          if curl -s http://localhost | grep -q "Secure Search"; then
            echo "✓ Application content is being served correctly"
          else
            echo "✗ Expected content not found"
            exit 1
          fi

      - name: Test security headers
        run: |
          echo "=== Security Headers Test ==="
          headers=$(curl -s -I http://localhost)
          echo "$headers"
          
          # Check for important security headers (optional - add if configured)
          check_header() {
            if echo "$headers" | grep -i "$1"; then
              echo "✓ $1 header found"
            else
              echo "⚠ $1 header missing (consider adding)"
            fi
          }
          
          check_header "X-Content-Type-Options"
          check_header "X-Frame-Options"

      - name: Stop services
        if: always()
        run: docker-compose down

  ui-test:
    runs-on: ubuntu-latest
    name: UI Testing with Playwright
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and dependencies
        run: |
          npm init -y || true
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Create Playwright tests
        run: |
          mkdir -p tests
          cat > tests/security-app.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');

          test.describe('Secure Search Application UI Tests', () => {
            test.beforeEach(async ({ page }) => {
              await page.goto('http://localhost');
            });

            test('should load the home page successfully', async ({ page }) => {
              await expect(page).toHaveTitle('Secure Search Application');
              await expect(page.locator('h1')).toContainText('Secure Search');
              await expect(page.locator('#searchInput')).toBeVisible();
              await expect(page.locator('button[type="submit"]')).toBeVisible();
            });

            test('should display all required form elements', async ({ page }) => {
              const searchInput = page.locator('#searchInput');
              const submitButton = page.locator('button[type="submit"]');
              const searchLabel = page.locator('label[for="searchInput"]');
              
              await expect(searchLabel).toContainText('Enter Search Term:');
              await expect(searchInput).toHaveAttribute('required', '');
              await expect(submitButton).toContainText('Search');
            });

            test('should handle valid search input correctly', async ({ page }) => {
              const validSearchTerm = 'test search query';
              
              await page.locator('#searchInput').fill(validSearchTerm);
              await page.locator('#searchInput').press('Enter');
              
              // Should navigate to results page
              await expect(page.locator('#resultPage')).toBeVisible();
              await expect(page.locator('#homePage')).not.toBeVisible();
              await expect(page.locator('#displayTerm')).toContainText(validSearchTerm);
            });

            test('should prevent XSS attacks with script tags', async ({ page }) => {
              const xssPayload = '<script>alert("xss")</script>';
              
              await page.locator('#searchInput').fill(xssPayload);
              await page.locator('#searchInput').press('Enter');
              
              // Should show error and stay on home page
              await expect(page.locator('#errorMessage')).toBeVisible();
              await expect(page.locator('#errorMessage')).toContainText('XSS attack detected');
              await expect(page.locator('#searchInput')).toHaveValue('');
              await expect(page.locator('#homePage')).toBeVisible();
              await expect(page.locator('#resultPage')).not.toBeVisible();
            });

            test('should prevent XSS attacks with event handlers', async ({ page }) => {
              const xssPayload = '<img src=x onerror=alert("xss")>';
              
              await page.locator('#searchInput').fill(xssPayload);
              await page.locator('#searchInput').press('Enter');
              
              await expect(page.locator('#errorMessage')).toBeVisible();
              await expect(page.locator('#errorMessage')).toContainText('XSS attack detected');
            });

            test('should prevent SQL injection attacks', async ({ page }) => {
              const sqlPayload = "' OR 1=1 --";
              
              await page.locator('#searchInput').fill(sqlPayload);
              await page.locator('#searchInput').press('Enter');
              
              // Should show error and stay on home page
              await expect(page.locator('#errorMessage')).toBeVisible();
              await expect(page.locator('#errorMessage')).toContainText('SQL injection detected');
              await expect(page.locator('#searchInput')).toHaveValue('');
            });

            test('should handle return to home functionality', async ({ page }) => {
              // First, perform a valid search
              await page.locator('#searchInput').fill('valid search term');
              await page.locator('#searchInput').press('Enter');
              
              // Verify on results page
              await expect(page.locator('#resultPage')).toBeVisible();
              
              // Click return button
              await page.locator('#backButton').click();
              
              // Should be back on home page with cleared input
              await expect(page.locator('#homePage')).toBeVisible();
              await expect(page.locator('#resultPage')).not.toBeVisible();
              await expect(page.locator('#searchInput')).toHaveValue('');
            });

            test('should properly sanitize HTML entities', async ({ page }) => {
              const htmlInput = '<b>bold text</b>';
              
              await page.locator('#searchInput').fill(htmlInput);
              await page.locator('#searchInput').press('Enter');
              
              // Should display sanitized text, not rendered HTML
              await expect(page.locator('#displayTerm')).toContainText('<b>bold text</b>');
              
              // Verify it's not actually bold
              const isBold = await page.locator('#displayTerm b').count();
              expect(isBold).toBe(0);
            });

            test('should clear error message on new input', async ({ page }) => {
              // First trigger an error
              await page.locator('#searchInput').fill('<script>alert("xss")</script>');
              await page.locator('#searchInput').press('Enter');
              await expect(page.locator('#errorMessage')).toBeVisible();
              
              // Submit valid input
              await page.locator('#searchInput').fill('valid input');
              await page.locator('#searchInput').press('Enter');
              
              // Error should be gone and results shown
              await expect(page.locator('#errorMessage')).not.toBeVisible();
              await expect(page.locator('#resultPage')).toBeVisible();
            });

            test('should handle empty input correctly', async ({ page }) => {
              // Clear the input and try to submit
              await page.locator('#searchInput').fill('');
              
              // HTML5 validation should prevent submission
              const isValid = await page.locator('#searchInput').evaluate(el => el.checkValidity());
              expect(isValid).toBe(false);
            });
          });
          EOF

      - name: Create Playwright config
        run: |
          cat > playwright.config.js << 'EOF'
          module.exports = {
            testDir: './tests',
            timeout: 30000,
            retries: 2,
            workers: 1,
            use: {
              headless: true,
              viewport: { width: 1280, height: 720 },
              actionTimeout: 10000,
              ignoreHTTPSErrors: true,
              video: 'retain-on-failure',
              screenshot: 'only-on-failure'
            },
            projects: [
              {
                name: 'chromium',
                use: { browserName: 'chromium' },
              },
            ],
            reporter: [
              ['html', { outputFolder: 'playwright-report', open: 'never' }],
              ['junit', { outputFile: 'test-results/junit.xml' }],
              ['list']
            ],
          };
          EOF

      - name: Start application with Docker Compose
        run: |
          mkdir -p nginx/html nginx/conf.d
          docker-compose up -d
          echo "Waiting for services to start..."
          sleep 10
          docker-compose ps
          curl http://localhost || echo "Service might still be starting..."

      - name: Run Playwright tests
        run: |
          npx playwright test --reporter=list
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results/junit.xml

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos
          path: test-results/**/*.webm

      - name: Stop services
        if: always()
        run: docker-compose down

  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: [integration-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: |
          mkdir -p nginx/html nginx/conf.d
          docker-compose up -d
          sleep 10

      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run performance test
        run: |
          echo "=== Running Performance Test ==="
          ab -n 1000 -c 50 -t 30 http://localhost/ > performance-results.txt || true
          
          echo "=== Performance Results ==="
          cat performance-results.txt
          
          # Extract key metrics
          requests_per_sec=$(grep "Requests per second" performance-results.txt | awk '{print $4}')
          time_per_request=$(grep "Time per request" performance-results.txt | grep "(mean)" | awk '{print $4}')
          
          echo "Requests per second: $requests_per_sec"
          echo "Time per request: $time_per_request ms"
          
          # Basic performance check (adjust thresholds as needed)
          if (( $(echo "$requests_per_sec < 50" | bc -l) )); then
            echo "⚠ Warning: Performance might be below expected threshold"
          else
            echo "✓ Performance is acceptable"
          fi

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results.txt

      - name: Stop services
        if: always()
        run: docker-compose down

  security-scan:
    runs-on: ubuntu-latest
    name: Container Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan on docker-compose
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose.yml'
          format: 'sarif'
          output: 'trivy-compose-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-compose-results.sarif'
          category: 'docker-compose'
