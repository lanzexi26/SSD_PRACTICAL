<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Search Application</title>
</head>
<body>
    <div id="homePage">
        <h1>Secure Search</h1>
        <form id="searchForm">
            <label for="searchInput">Enter Search Term:</label><br>
            <input type="text" id="searchInput" name="search" required><br><br>
            <button type="submit">Search</button>
        </form>
        <div id="errorMessage" style="color: red; display: none;"></div>
    </div>
    
    <div id="resultPage" style="display: none;">
        <h1>Search Result</h1>
        <p>You searched for: <strong id="displayTerm"></strong></p>
        <button id="backButton">Return to Home</button>
    </div>

    <script>
        // Input validation functions following OWASP guidelines
        function containsXSS(input) {
            // Check for common XSS patterns
            const xssPatterns = [
                /<script[^>]*>.*?<\/script>/gi,  // Script tags
                /<iframe[^>]*>.*?<\/iframe>/gi,  // Iframe tags
                /<object[^>]*>.*?<\/object>/gi,  // Object tags
                /<embed[^>]*>/gi,                 // Embed tags
                /<link[^>]*>/gi,                  // Link tags
                /javascript:/gi,                  // JavaScript protocol
                /on\w+\s*=/gi,                    // Event handlers (onclick, onload, etc.)
                /<img[^>]*>/gi,                   // Image tags
                /<svg[^>]*>/gi,                   // SVG tags
                /<style[^>]*>.*?<\/style>/gi,    // Style tags
                /expression\s*\(/gi,              // CSS expressions
                /import\s+/gi,                    // @import
                /<meta[^>]*>/gi,                  // Meta tags
                /<form[^>]*>/gi,                  // Form tags
                /vbscript:/gi,                    // VBScript protocol
                /data:text\/html/gi,              // Data URIs
                /<base[^>]*>/gi                   // Base tags
            ];
            
            return xssPatterns.some(pattern => pattern.test(input));
        }
        
        function containsSQLInjection(input) {
            // Check for common SQL injection patterns
            const sqlPatterns = [
                /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|UNION|ALTER|CREATE|EXEC|EXECUTE)\b)/gi,
                /(-{2}|\/\*|\*\/)/g,              // SQL comments
                /(\bOR\b\s*\d+\s*=\s*\d+)/gi,     // OR 1=1
                /(\bAND\b\s*\d+\s*=\s*\d+)/gi,    // AND 1=1
                /(';|";|`;)/g,                     // Quote with semicolon
                /(\bHAVING\b|\bGROUP\s+BY\b)/gi,  // HAVING, GROUP BY
                /(\bORDER\s+BY\b)/gi,              // ORDER BY
                /(xp_|sp_)/gi,                     // System stored procedures
                /(\bWAITFOR\s+DELAY\b)/gi,         // Time-based attacks
                /(\bBENCHMARK\b)/gi,               // MySQL benchmark
                /(\bSLEEP\b)/gi,                   // Sleep function
                /(\bCAST\b|\bCONVERT\b)/gi,        // Type conversion
                /(\bCHAR\b|\bNCHAR\b)/gi,          // Character functions
                /(\bINFORMATION_SCHEMA\b)/gi,      // Information schema
                /(\bSYS\.|SYSOBJECTS|SYSCOLUMNS)/gi // System tables
            ];
            
            return sqlPatterns.some(pattern => pattern.test(input));
        }
        
        function sanitizeInput(input) {
            // Basic sanitization - encode HTML entities
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }
        
        // Form handling
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const errorMessage = document.getElementById('errorMessage');
        const homePage = document.getElementById('homePage');
        const resultPage = document.getElementById('resultPage');
        const displayTerm = document.getElementById('displayTerm');
        const backButton = document.getElementById('backButton');
        
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            errorMessage.style.display = 'none';
            
            const searchTerm = searchInput.value.trim();
            
            // Validate input
            if (containsXSS(searchTerm)) {
                errorMessage.textContent = 'Error: Potential XSS attack detected. Please enter a valid search term.';
                errorMessage.style.display = 'block';
                searchInput.value = '';
                searchInput.focus();
                return;
            }
            
            if (containsSQLInjection(searchTerm)) {
                errorMessage.textContent = 'Error: Potential SQL injection detected. Please enter a valid search term.';
                errorMessage.style.display = 'block';
                searchInput.value = '';
                searchInput.focus();
                return;
            }
            
            // Input is safe - display results
            const sanitizedTerm = sanitizeInput(searchTerm);
            displayTerm.textContent = sanitizedTerm;
            homePage.style.display = 'none';
            resultPage.style.display = 'block';
        });
        
        backButton.addEventListener('click', function() {
            resultPage.style.display = 'none';
            homePage.style.display = 'block';
            searchInput.value = '';
            searchInput.focus();
        });
        
        // Focus on input when page loads
        window.addEventListener('load', function() {
            searchInput.focus();
        });
    </script>
</body>
</html>
