version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: nginx-webserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped
    networks:
      - webnet

  # Git Development Container
  git-dev:
    image: alpine/git:latest
    container_name: git-workspace
    environment:
      # Git configuration - USE ENVIRONMENT VARIABLES OR .env FILE
      - GIT_USER_NAME=${GIT_USER_NAME:-LAN ZEXI}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-2303456@sit.singaporetech.edu.sg}
      - GITHUB_TOKEN=${GITHUB_TOKEN}  # DO NOT PUT TOKEN HERE
    volumes:
      - ./workspace:/workspace
      - ./git-config/.gitconfig:/root/.gitconfig
      - ./git-config/.ssh:/root/.ssh
    working_dir: /workspace
    command: /bin/sh -c "git config --global user.name \"$$GIT_USER_NAME\" && git config --global user.email \"$$GIT_USER_EMAIL\" && tail -f /dev/null"
    restart: unless-stopped
    networks:
      - webnet

  # SonarQube
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - ./sonarqube/data:/opt/sonarqube/data
      - ./sonarqube/extensions:/opt/sonarqube/extensions
      - ./sonarqube/logs:/opt/sonarqube/logs
    networks:
      - webnet
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  sonarqube-db:
    image: postgres:13-alpine
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - webnet
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  webnet:
    driver: bridge